appId: com.phonedek.desktop
productName: PhoneDeck
copyright: Copyright © 2026 Pelozo
asar: true
npmRebuild: false
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: resources/keyboard-helper.ps1
    to: keyboard-helper.ps1
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
  executableName: PhoneDeck
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: PhoneDeck
  artifactName: PhoneDeck-${version}-Setup.${ext}
linux:
  target:
    - AppImage
  category: Utility
  icon: build/icon.png
mac:
  target:
    - zip
  category: public.app-category.utilities
  icon: build/icon.png
