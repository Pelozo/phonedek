appId: com.phonedek.desktop
productName: PhoneDeck
copyright: Copyright © 2026 Pelozo
asar: true
npmRebuild: false
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
  executableName: PhoneDeck
  extraResources:
    - from: resources/keyboard-helper.ps1
      to: keyboard-helper.ps1
publish:
  provider: github
  owner: Pelozo
  repo: phonedek

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: PhoneDeck
  artifactName: PhoneDeck-${version}-Setup.${ext}
linux:
  target:
    - AppImage
  category: Utility
  icon: build/icon.png
mac:
  # Apple Silicon first. Universal builds can be produced locally with
  # scripts/build-mac-helper.sh universal and `electron-builder --mac --universal`,
  # but the CI artifact is deliberately small and arm64-only.
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  category: public.app-category.utilities
  icon: build/icon.png
  artifactName: ${productName}-${version}-${arch}.${ext}
  # This is an unsigned community build. Ad-hoc/absent signatures cannot use
  # Squirrel.Mac auto-updates and must be opened once via Gatekeeper.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
  extraResources:
    - from: resources/mac/keyboard-helper
      to: keyboard-helper
  extendInfo:
    NSLocalNetworkUsageDescription: PhoneDeck uses your local network to connect to the Android remote app and discover this desktop.
