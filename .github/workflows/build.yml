name: Build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    name: Desktop (Windows installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Build NSIS installer
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneDeck-Windows
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.yml
          if-no-files-found: error
      - name: Upload unpacked app
        uses: actions/upload-artifact@v4
        with:
          name: PhoneDeck-Windows-Unpacked
          path: apps/desktop/release/win-unpacked/**
          if-no-files-found: warn

  android:
    name: Android (debug APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          # The old "tools" package no longer exists in current SDK repositories.
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        working-directory: apps/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneDeck-Android
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
