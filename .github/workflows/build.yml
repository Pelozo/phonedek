name: Build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    name: Desktop (Windows installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Build NSIS installer
        run: npm run dist:win
      - name: Verify auto-update metadata
        shell: pwsh
        run: |
          $release = "apps/desktop/release"
          if (-not (Test-Path "$release/latest.yml")) {
            throw "latest.yml was not generated by electron-builder"
          }
          if (-not (Test-Path "$release/win-unpacked/resources/app-update.yml")) {
            throw "app-update.yml is missing from the packaged app"
          }
          $blockmap = Get-ChildItem "$release/*.exe.blockmap" -ErrorAction SilentlyContinue
          if ($null -eq $blockmap) {
            throw "The NSIS differential blockmap was not generated"
          }
          Get-Content "$release/latest.yml"
          Get-Content "$release/win-unpacked/resources/app-update.yml"
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneDeck-Windows
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.yml
            apps/desktop/release/*.blockmap
          if-no-files-found: error
      - name: Upload unpacked app
        uses: actions/upload-artifact@v4
        with:
          name: PhoneDeck-Windows-Unpacked
          path: apps/desktop/release/win-unpacked/**
          if-no-files-found: warn

  macos:
    name: Desktop (macOS arm64)
    runs-on: macos-latest
    env:
      # Empty secrets keep the community build unsigned; when a Developer ID
      # and notarization credentials are present, electron-builder signs,
      # hardens and notarizes instead.
      CSC_IDENTITY_AUTO_DISCOVERY: false
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify Apple Silicon runner
        run: |
          uname -m
          node -p "process.arch"
          test "$(uname -m)" = "arm64"
      - name: Build Swift keyboard helper
        run: npm run build:mac-helper -w @phonedek/desktop
      - name: Self-test Swift keyboard helper
        run: apps/desktop/resources/mac/keyboard-helper --self-test
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Build macOS DMG and ZIP
        run: npm run dist:mac -w @phonedek/desktop
      - name: Verify macOS artifacts
        run: |
          set -euo pipefail
          cd apps/desktop/release
          ls -lah
          test -n "$(find . -maxdepth 1 -name '*.dmg' -print -quit)"
          ZIP="$(find . -maxdepth 1 -name '*.zip' -print -quit)"
          test -n "$ZIP"
          test -f latest-mac.yml
          grep -q '\.zip' latest-mac.yml
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          ditto -x -k "$ZIP" "$TMP"
          HELPER="$(find "$TMP" -path '*/PhoneDeck.app/Contents/Resources/keyboard-helper' -print -quit)"
          test -n "$HELPER"
          test -x "$HELPER"
          lipo -info "$HELPER" | grep -q arm64
          "$HELPER" --self-test
          APP="$(find "$TMP" -maxdepth 2 -name 'PhoneDeck.app' -print -quit)"
          test -n "$APP"
          EXE="$APP/Contents/MacOS/PhoneDeck"
          test -x "$EXE"
          # TCC attributes input permission to these identifiers; a stale
          # "Electron" identity makes the grant silently miss the helper.
          codesign -dv --verbose=4 "$EXE" 2>&1 | grep -q 'Identifier=com.phonedek.desktop'
          codesign -dv --verbose=4 "$HELPER" 2>&1 \
            | grep -qE 'Identifier=(com\.phonedek\.desktop\.keyboard-helper|keyboard-helper)'
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PhoneDeck-macOS-arm64
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/latest-mac.yml
            apps/desktop/release/*.blockmap
          if-no-files-found: error

  android:
    name: Android (debug APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          # The old "tools" package no longer exists in current SDK repositories.
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        working-directory: apps/android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneDeck-Android
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
